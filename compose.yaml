services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8001:8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - .env.cftunnel.vars
    depends_on:
      - frontend
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]

volumes:
  backend_data:
