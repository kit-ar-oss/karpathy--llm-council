name: Build & Publish (GHCR + Helm OCI)

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Uses the current repo as the base, e.g. ghcr.io/<owner>/<repo>
  IMAGE_BASE: ${{ github.repository }}
  CHART_NAME: llm-council
  CHART_DIR: charts/llm-council

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == "latest" ]]; then
            echo "chart_version=0.0.0-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "chart_version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/backend:sha-${{ steps.meta.outputs.short_sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/frontend:sha-${{ steps.meta.outputs.short_sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Helm registry login (for OCI)
        shell: bash
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | helm registry login "${REGISTRY}" --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package chart (versioned)
        shell: bash
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          cp -R "${CHART_DIR}" "${WORKDIR}/${CHART_NAME}"
          CHART_YAML="${WORKDIR}/${CHART_NAME}/Chart.yaml"
          sed -i "s/^version: .*/version: ${CHART_VERSION}/" "$CHART_YAML"
          sed -i "s/^appVersion: .*/appVersion: \"${CHART_VERSION}\"/" "$CHART_YAML"
          helm package "${WORKDIR}/${CHART_NAME}" -d "${WORKDIR}"
          echo "PACKAGED_TGZ=$(ls -1 "${WORKDIR}/${CHART_NAME}-"*.tgz | head -n1)" >> "$GITHUB_ENV"
        env:
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}

      - name: Push Helm chart (OCI) to GHCR
        shell: bash
        run: |
          set -euo pipefail
          helm push "${PACKAGED_TGZ}" "oci://${REGISTRY}/${IMAGE_BASE}/charts"

