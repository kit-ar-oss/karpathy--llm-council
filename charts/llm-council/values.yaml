nameOverride: ""
fullnameOverride: ""

global:
  # If set, overrides imagePullSecrets for both components
  imagePullSecrets: []

backend:
  image:
    repository: example.azurecr.io/example/llm-council/backend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8001

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  env:
    # If you set existingSecret, it must contain the key below.
    existingSecret: ""
    openrouterApiKeyKey: OPENROUTER_API_KEY
    # If existingSecret is empty, the chart can create a Secret from this value.
    # Prefer setting via --set-file or external secret managers.
    openrouterApiKey: ""

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClassName: ""
    mountPath: /app/data

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001

  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

frontend:
  image:
    repository: example.azurecr.io/example/llm-council/frontend
    tag: latest
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    # nginx in this image listens on port 80 (privileged port), so rootless defaults
    # would fail unless the image is rebuilt to use a high port or NET_BIND_SERVICE.
    enabled: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0

  containerSecurityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

serviceAccount:
  create: false
  name: ""
  annotations: {}
  automountServiceAccountToken: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: llm-council.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

gateway:
  enabled: false
  # If true, chart also creates a Gateway resource. Many clusters manage Gateways separately.
  createGateway: false
  gatewayClassName: ""
  gatewayName: ""
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: llm-council.local
  httpRoute:
    hostnames:
      - llm-council.local
    parentRefs: []
    # If parentRefs is empty and createGateway=true, chart wires the HTTPRoute to the created Gateway.
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - kind: Service
            name: "" # auto-filled to frontend service name when empty
            port: 80
