{{- $backendName := include "llm-council.componentName" (dict "root" . "component" "backend") -}}
{{- if and (not .Values.backend.env.existingSecret) .Values.backend.env.openrouterApiKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-env" $backendName }}
  labels:
    {{- include "llm-council.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  {{ .Values.backend.env.openrouterApiKeyKey }}: {{ .Values.backend.env.openrouterApiKey | quote }}
{{- end }}
