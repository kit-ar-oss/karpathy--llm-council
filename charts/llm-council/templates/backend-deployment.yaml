{{- $backendName := include "llm-council.componentName" (dict "root" . "component" "backend") -}}
{{- $secretName := "" -}}
{{- if .Values.backend.env.existingSecret -}}
{{- $secretName = .Values.backend.env.existingSecret -}}
{{- else if .Values.backend.env.openrouterApiKey -}}
{{- $secretName = printf "%s-env" $backendName -}}
{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $backendName }}
  labels:
    {{- include "llm-council.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      {{- include "llm-council.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "llm-council.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "llm-council.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.backend.podSecurityContext.enabled }}
      securityContext:
        runAsNonRoot: {{ .Values.backend.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.backend.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.backend.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.backend.podSecurityContext.fsGroup }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            {{- if $secretName }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.backend.env.openrouterApiKeyKey }}
            {{- end }}
          {{- if .Values.backend.containerSecurityContext.enabled }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.backend.containerSecurityContext.allowPrivilegeEscalation }}
            capabilities:
              {{- toYaml .Values.backend.containerSecurityContext.capabilities | nindent 14 }}
          {{- end }}
          {{- if .Values.backend.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.livenessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.backend.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.readinessProbe.path }}
              port: http
            initialDelaySeconds: {{ .Values.backend.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.backend.persistence.mountPath }}
      volumes:
        - name: data
          {{- if .Values.backend.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ printf "%s-data" $backendName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
