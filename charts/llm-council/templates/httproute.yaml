{{- if .Values.gateway.enabled -}}
{{- if not (or .Values.gateway.httpRoute.parentRefs .Values.gateway.createGateway) -}}
{{- fail "gateway.enabled=true requires either gateway.httpRoute.parentRefs or gateway.createGateway=true" -}}
{{- end -}}
{{- $frontendName := include "llm-council.componentName" (dict "root" . "component" "frontend") -}}
{{- $gwName := "" -}}
{{- if .Values.gateway.gatewayName -}}
{{- $gwName = .Values.gateway.gatewayName -}}
{{- else -}}
{{- $gwName = printf "%s-gateway" (include "llm-council.fullname" .) -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "llm-council.fullname" . }}
  labels:
    {{- include "llm-council.labels" . | nindent 4 }}
spec:
  {{- if .Values.gateway.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.gateway.httpRoute.hostnames | nindent 4 }}
  {{- end }}
  {{- if .Values.gateway.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml .Values.gateway.httpRoute.parentRefs | nindent 4 }}
  {{- else if .Values.gateway.createGateway }}
  parentRefs:
    - name: {{ $gwName }}
  {{- end }}
  rules:
    {{- range $i, $rule := .Values.gateway.httpRoute.rules }}
    - {{- if $rule.matches }}
      matches:
        {{- toYaml $rule.matches | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- range $j, $b := $rule.backendRefs }}
        - kind: {{ default "Service" $b.kind }}
          name: {{ default $frontendName $b.name }}
          port: {{ default $.Values.frontend.service.port $b.port }}
          {{- if hasKey $b "weight" }}
          weight: {{ $b.weight }}
          {{- end }}
        {{- end }}
    {{- end }}
{{- end }}
